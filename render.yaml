# Render blueprint for the FastAPI backend.
#
# Push this repository to GitHub, then in Render: New -> Blueprint -> pick the
# repo. Render reads this file and provisions the service.
#
# After the first deploy, copy the service URL (https://<name>.onrender.com) and
# set it as API_BASE in Netlify, then set CORS_ORIGINS here to your Netlify URL.
#
# Free tier notes:
#   * 512 MB RAM. This app idles around 300-400 MB with the spaCy model loaded,
#     so one worker fits; two do not.
#   * The instance sleeps after ~15 minutes idle and takes ~30-60s to wake.
#     The frontend's request timeout is 120s, so a cold start still succeeds.
#   * The disk is ephemeral: the SQLite database resets on every deploy and
#     sleep cycle. Attach PostgreSQL (below) if stored analyses must persist.

services:
  - type: web
    name: resume-intelligence-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DEBUG
        value: "false"
      # Replace with your Netlify site URL once it exists. Leaving "*" works but
      # lets any origin call your API.
      - key: CORS_ORIGINS
        value: "*"
      # Allows Netlify deploy previews through when CORS_ORIGINS is locked down.
      - key: CORS_ORIGIN_REGEX
        value: "https://.*--.*\\.netlify\\.app"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: STORE_UPLOADED_FILES
        value: "false"
      # Uncomment together with the database block below to persist analyses.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: resume-intelligence-db
      #     property: connectionString

# Optional: uncomment to get a managed PostgreSQL instance. The schema is
# identical - the app only needs DATABASE_URL to point at it, and psycopg must
# be added to backend/requirements.txt.
# databases:
#   - name: resume-intelligence-db
#     plan: free
