# Netlify hosts the dashboard (static). The FastAPI backend runs elsewhere -
# Netlify has no Python runtime and cannot run spaCy/scikit-learn. Set the
# API_BASE environment variable to your backend URL; see docs/DEPLOYMENT.md.

[build]
  publish = "frontend"
  command = "sh netlify/inject-config.sh"

[build.environment]
  # Nothing is compiled - this only silences Netlify's dependency detection.
  NODE_VERSION = "20"

# The app is a hash router served from one document, so every path resolves to
# index.html. Explicit 200 (not 301) so deep links keep their URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The page loads only its own assets and talks to the configured API.
    # 'unsafe-inline' covers the theme bootstrap script and the inline styles
    # the views generate; connect-src stays open because the API host is
    # configured per deployment.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; base-uri 'self'; form-action 'self'"

# Fingerprinted by the ?v= query, so the files themselves must revalidate.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"
